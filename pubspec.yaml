name: smart_todo
description: "A responsive Flutter task management application for Android and web featuring Firebase Authentication, Cloud Firestore real-time CRUD, Provider state management, and dynamic Light/Dark themes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # State Management
  provider: ^6.1.2

  # Persistence & Utilities
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  package_info_plus: ^10.2.1

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
